[tox]
skipsdist = True
usedevelop = True
skip_missing_interpreters = True

envlist =
    py{310,311,312,313}-dj{42,52}-wt{71}
;    py{310,311,312,313}-dj{42,52}-wt{72}
;    py{310,311,312,313}-dj{42,52}-wt{73}
    py{312,313,314}-dj{52,60}-wt{74}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/longclaw

deps =
    coverage
    django-extensions
    django-polymorphic
    django-ipware
    mock
    wagtail-factories

    dj42: Django>=4.2,<4.3
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1

    wt71: wagtail>=7.1,<7.2
    wt72: wagtail>=7.2,<7.3
    wt73: wagtail>=7.3,<7.4
    wt74: wagtail>=7.4,<7.5

install_command = pip install -U {opts} {packages}

commands =
    coverage run --source longclaw runtests.py
    coverage xml --omit=*/apps.py,*/migrations/*,*/__init__.py,*/gateways/braintree.py,*/gateways/stripe.py,*/bin/longclaw.py

basepython =
    py310: python3.10
